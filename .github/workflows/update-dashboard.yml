name: Update Issue Dashboard
# trigger

on:
  schedule:
    # Run hourly at the top of each hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'scripts/generate-dashboard.sh'
      - '.github/workflows/update-dashboard.yml'

concurrency:
  group: update-dashboard
  cancel-in-progress: false


permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Setup GitHub CLI
        run: |
          type -p gh >/dev/null || (
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
          )
      
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # The previous run's state.json drives the "new since last run" badges.
      # It lives on the deployed site, not in the repo.
      - name: Restore previous state
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p docs
          if curl -fsSL "$BASE_URL/state.json" -o /tmp/state.json && jq -e . /tmp/state.json >/dev/null; then
            mv /tmp/state.json docs/state.json
          else
            echo "No previous state.json found; starting fresh"
          fi

      - name: Generate dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/generate-dashboard.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      # Without hourly commits the repo has no activity, and GitHub disables
      # scheduled workflows after 60 days of inactivity. Re-enabling resets
      # that timer.
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable update-dashboard.yml --repo "$GITHUB_REPOSITORY"

  # A separate job, so the artifact upload is visible before deploy looks it up.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
